# Smaller model and batches for a first run on a 16 GB laptop. CPU beats MPS here (~1.3 s/step on an M1 Pro).
data:
  csv: data/kg.csv
  processed: data/primekg.pt

holdout:
  genes: [POU5F1, SOX2, KLF4, MYC]
  targets:
    - stem cell population maintenance
    - somatic stem cell population maintenance
    - cellular senescence
    - cell aging
  relation: bioprocess_protein
  # Also hide links to ontology neighbours of the targets (e.g. "neuronal stem cell population
  # maintenance"), so a near-synonym cannot hand the model the hidden answer. 0 disables.
  expand_hops: 1

model:
  dim: 64
  num_layers: 2
  num_bases: 4
  dropout: 0.1

train:
  steps: 2000
  batch_size: 4096
  neg_per_pos: 4
  message_edges: 500000
  lr: 0.003
  seed: 0
  fsdp: false
  log_every: 100
  checkpoint: checkpoints/laptop.pt

agent:
  model: claude-opus-5-5
  effort: high
