[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "LLM + GNN reasoning over a biomedical knowledge graph to find cell-rejuvenation interventions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.116",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rewind*"]
